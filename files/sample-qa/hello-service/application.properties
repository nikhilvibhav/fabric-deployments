# Sample application: provides its own application.properties instead of the
# shared files/application.properties fallback.
spring.profiles.active=sample-qa
server.port=[[server_port]]
logging.config=file:config/logback.xml
greeting.message=Hello from [[stage]] ([[version]])
# Encrypted secret: secrets/sample-qa/hello-service.json
greeting.api.token=[[api_token]]
