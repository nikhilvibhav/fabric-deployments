#SPRING CONFIG
spring.profiles.active=[[spring_profile]]
#spring.config.name= # config file name (default to 'application')
#spring.config.location= # location of config file

## Spring Boot Application Properties should go in this file.
spring.main.sources=[[spring_source]]

# IDENTITY
#spring.application.name=

# LOGGING
# directory for log files to live in
logging.path=/var/log/camel/[[application_execute]]
logging.config=file:config/logback.xml

# EMBEDDED SERVER CONFIGURATION
server.port=[[server_port]]

#OIS SOAP API configurations
soap.api.port=[[soap_api_port]]

#OIS REST API configurations
rest.api.port=[[rest_api_port]]

# JMX
# Expose MBeans from Spring
spring.jmx.enabled=true

# MANAGEMENT HTTP SERVER
# HTTP port to expose management endpoints, defaults to 'server.port'. Set it to '-1' to disable
#management.port=[[server_port]]
# address that the management endpoints are available on
#management.address=
# default to '/'
#management.contextPath=

# JDBC
spring.datasource.driver-class-name=[[jdbc_driver_class_name]]
spring.datasource.url=[[jdbc_database_url]]
spring.datasource.username=[[jdbc_database_username]]
spring.datasource.password=[[jdbc_database_password]]

# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle = [[jdbc_testWhileIdle]]
spring.datasource.validationQuery = [[jdbc_validationQuery]]

# Show or not log for each sql query
spring.jpa.show-sql = [[jpa_show_sql]]

# Hibernate ddl auto (create, create-drop, update)
spring.jpa.hibernate.ddl-auto = [[jpa_hibernate_ddl_auto]]

# Naming strategy
spring.jpa.hibernate.naming-strategy = [[jpa_hibernate_naming_strategy]]

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager)

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = [[jpa_properties_hibernate_dialect]]

# Number of ms to wait before throwing an exception if no connection is available.
spring.datasource.max-wait = [[jpa_properties_datasource_maxwait]]

# Maximum number of active connections that can be allocated from this pool at the same time.
spring.datasource.max-active = [[jpa_properties_datasource_maxactive]]

# Validate the connection before borrowing it from the pool.
spring.datasource.test-on-borrow = [[jpa_properties_datasource_test_on_borrow]]

# Spring Actuator Endpoints
info.app.name=[[application]]
info.app.description=[[project_description]]
info.app.version=[[version]]
logging.file=/var/log/camel/[[application]]/[[application]].log