[project]
name = "fabric-deployments"
version = "0.1.0"
description = "Python CLI that deploys JAR services over SSH with Fabric: atomic releases, automatic rollback, and Git-stored secrets encrypted with libsodium."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nikhil Vibhav", email = "nikhil92ind@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fabric>=3.2.3",
    "invoke>=2.2.1",
    "pynacl>=1.6.2",
]

[dependency-groups]
dev = [
    "coverage>=7.17.3",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "shellcheck-py>=0.11.0.1",
    "types-paramiko>=5.1.0",
]

[tool.uv]
# An application run with `python -m deployment`, not an installable package.
package = false

[tool.ruff.lint]
# Defaults plus bugbear, bandit (security), pyupgrade and import sorting, and
# limits on function complexity, branches and statements.
extend-select = ["B", "S", "UP", "I", "C901", "PLR0912", "PLR0915"]
ignore = ["BLE001"]

[tool.mypy]
python_version = "3.11"
files = ["deployment", "tasks.py"]
# Type-check function bodies even before every signature is annotated.
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Fabric ships no type information.
module = ["fabric", "fabric.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests replace methods with mocks on purpose.
module = ["deployment.tests.*"]
disable_error_code = ["method-assign"]

[[tool.mypy.overrides]]
# Annotated modules: every function signature must have type hints.
module = [
    "deployment.__main__",
    "deployment.artifacts",
    "deployment.config",
    "deployment.remote",
    "deployment.secrets",
    "tasks",
]
disallow_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["deployment"]
omit = ["deployment/tests/*"]

[tool.coverage.report]
# CI fails if branch coverage drops below this; raise it as tests are added.
fail_under = 85
show_missing = true
skip_covered = true
