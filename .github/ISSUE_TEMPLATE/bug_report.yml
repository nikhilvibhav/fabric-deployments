name: Bug report
description: The deployment CLI or the secrets commands didn't behave as expected.
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              This repository is **public**. Never paste secret values, private keys,
              Artifactory credentials, or internal hostnames and IP addresses. Reproduce
              with the sample stages (`sample-qa`, `sample-prod`) where you can, and replace
              anything sensitive with placeholders such as `<host>`.

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: Include the error message the CLI printed.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: command
      attributes:
          label: Command
          description: The exact command you ran, with sensitive values replaced.
          render: shell
          placeholder: |
              python -m deployment plan --stage sample-qa --roles app1 --application hello-service --version 1.0.0
      validations:
          required: true

    - type: dropdown
      id: action
      attributes:
          label: Action
          options:
              - plan
              - deploy
              - rollback
              - start / stop
              - secrets (keygen, set, check, verify, rekey…)
              - other
      validations:
          required: true

    - type: dropdown
      id: service-manager
      attributes:
          label: Service manager on the target
          description: From the stage inventory's `use_supervisor` setting.
          options:
              - Supervisor
              - SysV
              - Not relevant
      validations:
          required: true

    - type: input
      id: commit
      attributes:
          label: Commit
          description: Output of `git rev-parse --short HEAD` in your checkout.
          placeholder: aa53f6f
      validations:
          required: true

    - type: input
      id: python
      attributes:
          label: Python version
          description: Output of `uv run python --version` on the controller.
          placeholder: Python 3.13.2

    - type: textarea
      id: logs
      attributes:
          label: Log output
          description: The CLI's log lines, with hosts, URLs and credentials redacted.
          render: shell

    - type: checkboxes
      id: redacted
      attributes:
          label: Before submitting
          options:
              - label: I removed secret values, private keys, credentials and internal hostnames or IP addresses from this report.
                required: true
