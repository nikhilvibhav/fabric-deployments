name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What are you trying to do, and what gets in the way today?
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: How should it work? Include example commands or inventory settings if you can.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered

    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Deployment (plan, deploy, rollback, start, stop)
              - Encrypted secrets
              - Inventories and configuration templates
              - Artifact resolution and Artifactory
              - CI, tooling or documentation
              - Other
      validations:
          required: true
