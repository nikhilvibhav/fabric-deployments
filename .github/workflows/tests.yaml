name: Lint and Unit Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Least privilege: jobs only read the repository.
permissions:
    contents: read

# Cancel superseded runs of the same branch or pull request.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: true

            - name: Run Ruff
              run: uv run --locked ruff check .

            - name: Check code formatting
              run: uv run --locked ruff format --check .

            - name: Type check
              run: uv run --locked mypy

    secrets:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: true

            - name: Check encrypted secrets
              run: uv run --locked --no-dev python -m deployment secrets check

            - name: Plan every configured application offline
              run: |
                  for dir in files/*/*/; do
                      stage=$(basename "$(dirname "$dir")")
                      application=$(basename "$dir")
                      role=$(jq -r '.hosts[0].roles[0]' "deployment/inventories/$stage.json")
                      echo "plan $stage/$application ($role)"
                      uv run --locked --no-dev python -m deployment plan \
                          --stage "$stage" --roles "$role" \
                          --application "$application" --version 1.0.0 >/dev/null
                  done

    audit:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  enable-cache: true

            - name: Audit locked runtime dependencies for known vulnerabilities
              run: |
                  uv export --locked --no-dev --no-emit-project --format requirements-txt \
                      -o "$RUNNER_TEMP/requirements.txt"
                  uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

    secret-scan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository with full history
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
                  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              run: |
                  archive="$RUNNER_TEMP/gitleaks.tar.gz"
                  curl -sSfL -o "$archive" \
                      "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check -
                  tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

            - name: Scan every commit for secrets
              run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose .'

    test:
        needs: lint
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up uv with Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Run tests with coverage
              run: uv run --locked coverage run -m unittest discover -s deployment/tests -v

            - name: Report coverage (fails below fail_under in pyproject.toml)
              run: |
                  {
                      echo "### Coverage (Python ${{ matrix.python-version }})"
                      uv run --locked coverage report --format=markdown || true
                  } >> "$GITHUB_STEP_SUMMARY"
                  uv run --locked coverage report
