name: Lint and Unit Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Run Ruff
              run: uv run --locked ruff check deployment

            - name: Check code formatting
              run: uv run --locked ruff format --check deployment

            - name: Type check
              run: uv run --locked mypy

    secrets:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true

            - name: Check encrypted secrets
              run: uv run --locked --no-dev python -m deployment secrets check

    test:
        needs: lint
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up uv with Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Run tests
              run: uv run --locked python -m unittest discover -s deployment/tests -v
