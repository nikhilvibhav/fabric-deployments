version: 2
updates:
    # Python dependencies in pyproject.toml and uv.lock.
    - package-ecosystem: uv
      directory: /
      schedule:
          interval: weekly
      groups:
          python:
              patterns: ["*"]

    # Actions in .github/workflows, pinned to commit SHAs.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
